<!doctype html>
<html>
<head>
<meta charset="UTF-8">
<title>All About Potatoes</title>
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@400..700&display=swap" rel="stylesheet">
<style>
    @font-face {
        font-family: Georgia;
        src: url("Georgia.ttf");
    } 
    body {
        background: whitesmoke;
    } 
    #page {
        width: 928px;
        height: 1224px;
        background: white;
        margin: 0 auto;
        padding: 48px;
        border: 1px solid darkgray;
        box-shadow: 2px 3px 6px darkgray;
    } 
    h1 {
        font: 48pt/1.0em 'Dancing Script', cursive;
        text-align: center;
        text-shadow: 2px 3px 6px darkorange;
    } 
    h2 {
        font: italic 14pt/2.4em Georgia, serif;
        text-align: center;
    } 
    p {
        font: 14pt/1.4em Georgia, serif;
        margin-bottom: 24px;
    } 
    /* Grid container for the potato photos */
    .photo-grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 16px;
        margin: 24px 0;
    }
    /* Sizing photos to a common width per repository guidelines */
    .photo-grid img {
        width: 384px;
        max-width: 100%;
        height: auto;
        border: 1px solid dimgray;
        box-shadow: 2px 3px 6px darkgray;
        object-fit: cover;
    }
</style>
</head>

<body>
<div id="page">
<h1>All About Potatoes</h1>
<h2>Created with <a href="https://chatai.com">ChatAI</a> and Canva</h2>

<!-- Photo Grid section using the specified repository assets -->
<div class="photo-grid">
    <img src="photo-1518977676601-b53f82aba655.avif" alt="Potatoes growing in soil">
    <img src="photo-1603048719539-9ecb4aa395e3.avif" alt="Freshly harvested potatoes">
    <img src="premium_photo-1724256031338-b5bfba816cfd.avif" alt="Raw raw potatoes ready for cooking">
</div>
</body>
</html>
